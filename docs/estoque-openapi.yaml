openapi: 3.0.3
info:
  title: ft_machry - Estoque (documentação complementar)
  version: '1.0'
paths:
  /api/estoque/inventario:
    get:
      tags: [Estoque]
      summary: Inventário de lotes com saldo
      parameters:
        - {name: produto_id, in: query, schema: {type: integer}}
        - {name: lote_id, in: query, schema: {type: integer}}
      responses:
        '200': {description: Inventário retornado}
  /api/estoque/lotes:
    get:
      tags: [Lotes]
      summary: Lista lotes
      responses:
        '200': {description: Lista de lotes}
    post:
      tags: [Lotes]
      summary: Cria lote com saldo inicial zero
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [produto_id, localizacao_id]
              properties:
                produto_id: {type: integer}
                localizacao_id: {type: integer}
                data_producao: {type: string, format: date, nullable: true}
                data_validade: {type: string, format: date, nullable: true}
                custo_unitario: {type: number, nullable: true}
      responses:
        '201': {description: Lote criado}
        '400': {description: Dados inválidos}
  /api/estoque/lotes/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    get:
      tags: [Lotes]
      summary: Detalha lote
      responses:
        '200': {description: Lote encontrado}
        '404': {description: Lote inexistente}
    put:
      tags: [Lotes]
      summary: Edita validade, produção ou custo (não altera saldo)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data_validade: {type: string, format: date, nullable: true}
                data_producao: {type: string, format: date, nullable: true}
                custo_unitario: {type: number, nullable: true}
      responses:
        '200': {description: Lote atualizado}
        '400': {description: Dados inválidos}
        '404': {description: Lote inexistente}
  /api/estoque/localizacoes:
    get:
      tags: [Localizações]
      summary: Lista localizações
      responses:
        '200': {description: Localizações retornadas}
    post:
      tags: [Localizações]
      summary: Cria localização
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome]
              properties:
                nome: {type: string}
                tipo: {type: string, enum: [SECO, RESFRIADO, CONGELADO]}
                parent_id: {type: integer, nullable: true}
                foto_url: {type: string, nullable: true}
      responses:
        '201': {description: Localização criada}
        '400': {description: Dados inválidos}
  /api/estoque/localizacoes/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    put:
      tags: [Localizações]
      summary: Atualiza localização
      responses:
        '200': {description: Atualizado}
        '400': {description: Dados inválidos}
        '404': {description: Não encontrado}
    delete:
      tags: [Localizações]
      summary: Remove localização sem dependências
      responses:
        '204': {description: Removido}
        '400': {description: Há dependências}
        '404': {description: Não encontrado}
  /api/estoque/movimentacoes:
    get:
      tags: [Movimentações]
      summary: Histórico de movimentações
      parameters:
        - {name: limite, in: query, schema: {type: integer, default: 100, maximum: 500}}
        - {name: tipo, in: query, schema: {type: string}}
        - {name: lote_id, in: query, schema: {type: integer}}
        - {name: usuario_id, in: query, schema: {type: integer}}
      responses:
        '200': {description: Histórico}
    post:
      tags: [Movimentações]
      summary: Registra movimentação e altera os saldos via trigger
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipo, lote_id, usuario_id, quantidade]
              properties:
                tipo: {type: string, enum: [ENTRADA, SAIDA, TRANSFERENCIA, TRANSFORMACAO, AJUSTE_ENTRADA, AJUSTE_SAIDA]}
                lote_id: {type: integer}
                lote_destino_id: {type: integer}
                quantidade: {type: number, exclusiveMinimum: 0}
                quantidade_destino: {type: number, exclusiveMinimum: 0}
                usuario_id: {type: integer}
                motivo: {type: string}
                observacao: {type: string}
      responses:
        '201': {description: Movimentação registrada}
        '400': {description: Validação ou estoque insuficiente}
  /api/estoque/sugestao-saida/{produto_id}:
    get:
      tags: [Estoque]
      summary: Sugere separação FEFO, sem baixar estoque
      parameters:
        - {name: produto_id, in: path, required: true, schema: {type: integer}}
        - {name: quantidade, in: query, required: true, schema: {type: number, exclusiveMinimum: 0}}
      responses:
        '200': {description: Lotes sugeridos}
